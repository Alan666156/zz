spring:
  application:
    name: baby-feeding
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zz_dev?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    # No password default: the application must fail fast when it is missing.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # No password default: the application must fail fast when it is missing.
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    time-zone: UTC
    # The API contract shows explicit nulls (deletedAt, amountValue, data), so
    # nulls are serialized instead of being omitted.
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never

app:
  device-pepper: ${APP_DEVICE_PEPPER}
  export-token-key: ${APP_EXPORT_TOKEN_KEY}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  version: ${APP_VERSION:1.0.0}
  redis-key-prefix: ${APP_REDIS_KEY_PREFIX:zz:bf:v1:}
  export-token-ttl-seconds: 300

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.zz.babyfeeding: INFO
