# TEST-ONLY configuration. Never point this at zz_dev or production.
# TestEnvironmentGuard refuses to start unless the URL contains /zz_test,
# Redis database is 15 and the key prefix starts with "test:".
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/zz_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: root
    password: root123
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root123
      database: 15
      timeout: 2s

app:
  # Test-only secrets, not used outside integration tests.
  device-pepper: test-only-device-pepper-0123456789abcdef
  export-token-key: test-only-export-token-key-0123456789abcdef
  redis-key-prefix: "test:zz:bf:v1:"
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
  version: 1.0.0-test

logging:
  level:
    root: WARN
    com.zz.babyfeeding: INFO
